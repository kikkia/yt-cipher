openapi: 3.0.0
info:
  title: yt-cipher API
  description: A web service for solving YouTube's cipher challenges and minting WebPO tokens.
  version: 1.0.0
servers:
  - url: /
paths:
  /decrypt_signature:
    post:
      summary: Decrypts a signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encrypted_signature:
                  type: string
                n_param:
                  type: string
                player_url:
                  type: string
      responses:
        '200':
          description: Decrypted signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  decrypted_signature:
                    type: string
                  decrypted_n_sig:
                    type: string
  /get_sts:
    post:
      summary: Gets a Short-Term Secret (STS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_url:
                  type: string
      responses:
        '200':
          description: STS value
          content:
            application/json:
              schema:
                type: object
                properties:
                  sts:
                    type: string
  /resolve_url:
    post:
      summary: Resolves a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stream_url:
                  type: string
                player_url:
                  type: string
                encrypted_signature:
                  type: string
                signature_key:
                  type: string
                n_param:
                  type: string
      responses:
        '200':
          description: Resolved URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved_url:
                    type: string
  /generate:
    post:
      summary: Mints a WebPO token (poToken)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content_binding:
                  type: string
                  description: Usually an 11 character video ID. Omit to bind to fetched visitor data.
                coldToken:
                  type: boolean
                  description: Also return a cold start token for the same binding.
      responses:
        '200':
          description: Generated PoToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  poToken:
                    type: string
                  contentBinding:
                    type: string
                  coldStartToken:
                    type: string
                    nullable: true
        '503':
          description: Too many PoToken requests in flight
        '504':
          description: Generation timed out
  /decode_cold_start:
    post:
      summary: Decodes a cold start token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Decoded cold start token
          content:
            application/json:
              schema:
                type: object
                properties:
                  contentBinding:
                    type: string
                  timestamp:
                    type: integer
                  unknownVal:
                    type: integer
                  clientState:
                    type: integer
                  keys:
                    type: array
                    items:
                      type: integer
                  date:
                    type: string
                    format: date-time
        '400':
          description: Invalid cold start token